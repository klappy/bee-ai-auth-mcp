name: claude
# Wire: `@claude` on a PR/issue comment wakes a seat that boards from CLAUDE.md and the order on the branch.
# Secret ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN) is HUMAN-ONLY — set in repo secrets by the captain; no seat reads it.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]
jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Boarding is in CLAUDE.md at repo root; the order is orders/*.md on the branch; the ticket is on the kitchen rail.
          claude_args: "--max-turns 40"
