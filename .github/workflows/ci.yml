# CI — the enforcer for the test battery.
#
# Pattern borrowed from klappy/git-repo-auth-mcp/.github/workflows/ci.yml per
# klappy://canon/constraints/release-validation-gate — convention is optional;
# convention plus an enforcer is binding. Contract: docs/ci-cd.md.
#
#   check                 typecheck + unit tests (no network) — required gate
#   deployed-validation   live smoke ONLY when vars.DEPLOYED_VALIDATION_URL
#                         names an isolated Worker. This Worker binds a Durable
#                         Object + Container; Cloudflare does not generate
#                         Preview URLs for that shape, and `versions upload`
#                         does not publish container images. Do not poll a
#                         branch alias. Do not smoke production from PRs.
#                         Do not change the non-production build command into
#                         a production deploy.
#
# Canon: klappy://canon/constraints/per-environment-worker-projects
# CF docs (checked 2026-09-08):
#   https://developers.cloudflare.com/workers/ci-cd/builds/configuration/
#   https://developers.cloudflare.com/containers/guides/deploy/

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & Unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  deployed-validation:
    name: Deployed validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: check
    steps:
      - name: Gate on an isolated validation Worker
        id: gate
        run: |
          URL="${{ vars.DEPLOYED_VALIDATION_URL }}"
          echo "This Worker binds a Durable Object + Container."
          echo "Cloudflare Preview URLs are not generated for that shape."
          echo "\`versions upload\` does not publish container images."
          echo "D0031 removed bee-ai-auth-mcp-staging; wrangler.jsonc has no env.staging."
          echo "Do not poll <slug>-bee-ai-auth-mcp.klappy.workers.dev."
          echo "Do not point this job at production (bee.klappy.dev)."
          if [ -z "$URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Named gap: repo variable DEPLOYED_VALIDATION_URL is unset."
            echo "Unit/typecheck remain the required automated gate."
            echo "Hosted email-login acceptance stays a human/config cargo."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "base_url=${URL}" >> "$GITHUB_OUTPUT"
            echo "Isolated validation URL is configured; running live smoke."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip == 'false'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
        if: steps.gate.outputs.skip == 'false'

      - name: Observe /version on the isolated Worker
        if: steps.gate.outputs.skip == 'false'
        run: |
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          URL="${{ steps.gate.outputs.base_url }}/version"
          DEPLOYED=$(curl -fs --max-time 10 "$URL" 2>/dev/null || true)
          echo "Isolated Worker /version: '${DEPLOYED:-<none>}'"
          echo "Commit under test: ${EXPECTED_SHA}"
          case "$EXPECTED_SHA" in
            "$DEPLOYED"*)
              echo "Isolated Worker is serving the commit under test."
              ;;
            *)
              echo "Isolated Worker is not serving the commit under test."
              echo "Refuse smoke against a stale or other SHA. Set DEPLOYED_VALIDATION_URL only when that Worker tracks this PR head."
              exit 1
              ;;
          esac

      - name: Run smoke battery against isolated Worker
        if: steps.gate.outputs.skip == 'false'
        env:
          SMOKE_BASE_URL: ${{ steps.gate.outputs.base_url }}
        run: npm run test:smoke
